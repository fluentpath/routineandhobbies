<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluent Path ESL Corner — Routines &amp; Hobbies</title>
<style>
  :root{
    --blue-deep:#0B2E9E;
    --blue-bright:#2F6BFF;
    --blue-medium:#4F8CFF;
    --blue-light:#8FCBFF;
    --blue-ice:#EAF3FF;
    --white:#FFFFFF;
    --ink:#132247;
    --ink-soft:#4C5B7C;
    --coral:#FF8B6B;
    --mint:#26B583;
    --mint-bg:#E3FBF1;
    --amber:#FFA93E;
    --amber-bg:#FFF3DF;
    --red:#E4573D;
    --red-bg:#FDE7E2;
    --bg:#F2F6FF;
    --card-radius:22px;
    --shadow-soft:0 10px 30px rgba(20,50,130,0.10);
    --shadow-pop:0 16px 40px rgba(20,50,130,0.18);
    --font-head:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
    --font-body:'Segoe UI',Tahoma,Verdana,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:
      radial-gradient(circle at 12% -10%, #d8e8ff 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, #dbe9ff 0%, transparent 40%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  .app{max-width:1180px;margin:0 auto;padding:0 18px 60px;}

  /* ---------- HEADER ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:18px 6px 14px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img{
    width:54px;height:54px;object-fit:contain;
    filter:drop-shadow(0 6px 14px rgba(30,70,180,0.28));
  }
  .brand-text h1{
    margin:0;font-family:var(--font-head);font-size:1.32rem;
    color:var(--blue-deep);line-height:1.1;font-weight:800;
    letter-spacing:.2px;
  }
  .brand-text span{font-size:.82rem;color:var(--ink-soft);font-weight:600;}
  .header-actions{display:flex;gap:10px;align-items:center;}
  .icon-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--white);border:1.5px solid #d7e4ff;
    color:var(--blue-deep);font-weight:700;font-size:.85rem;
    padding:9px 15px;border-radius:999px;cursor:pointer;
    box-shadow:var(--shadow-soft);transition:transform .15s ease, box-shadow .15s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop);}
  .icon-btn:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--coral);outline-offset:2px;
  }

  /* ---------- PROGRESS ---------- */
  .progress-wrap{padding:0 6px;margin-bottom:14px;}
  .progress-track{
    height:10px;border-radius:999px;background:#dbe6ff;overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(20,50,130,0.15);
  }
  .progress-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--blue-light),var(--blue-bright));
    width:12.5%;transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    display:flex;justify-content:space-between;font-size:.78rem;
    color:var(--ink-soft);margin-top:6px;font-weight:600;
  }

  /* ---------- TABS ---------- */
  nav.tabs{
    display:flex;gap:8px;overflow-x:auto;padding:4px 6px 14px;
    scrollbar-width:thin;
  }
  nav.tabs::-webkit-scrollbar{height:6px;}
  nav.tabs::-webkit-scrollbar-thumb{background:#c3d6ff;border-radius:6px;}
  .tab-btn{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    background:var(--white);border:1.5px solid #dce8ff;color:var(--ink-soft);
    font-weight:700;font-size:.86rem;padding:10px 16px;border-radius:14px;
    cursor:pointer;white-space:nowrap;transition:all .18s ease;
    box-shadow:0 2px 6px rgba(20,50,130,0.05);
  }
  .tab-btn .num{
    width:20px;height:20px;border-radius:50%;background:#eef3ff;color:var(--blue-deep);
    font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  .tab-btn.active{
    background:linear-gradient(135deg,var(--blue-bright),var(--blue-deep));
    color:var(--white);border-color:transparent;box-shadow:var(--shadow-pop);
    transform:translateY(-1px);
  }
  .tab-btn.active .num{background:rgba(255,255,255,0.25);color:#fff;}
  .tab-btn.done:not(.active){border-color:var(--mint);color:var(--mint);}
  .tab-btn.done:not(.active) .num{background:var(--mint-bg);color:var(--mint);}

  /* ---------- PANEL / CARD ---------- */
  .panel{display:none;animation:fadeUp .35s ease;}
  .panel.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .card{
    background:var(--white);border-radius:var(--card-radius);
    box-shadow:var(--shadow-soft);padding:28px 30px;margin-bottom:20px;
    border:1px solid #eaf1ff;
  }
  .card h2{
    font-family:var(--font-head);color:var(--blue-deep);font-size:1.5rem;
    margin:0 0 6px;
  }
  .card h3{font-family:var(--font-head);color:var(--blue-deep);font-size:1.12rem;margin:20px 0 8px;}
  .subtitle{color:var(--ink-soft);font-size:1.02rem;margin:0 0 18px;font-weight:600;}
  .lead{font-size:1.02rem;line-height:1.6;color:var(--ink);}
  .pill-note{
    display:flex;gap:10px;align-items:flex-start;background:var(--blue-ice);
    border:1px solid #cfe1ff;border-radius:16px;padding:14px 16px;margin:14px 0;
    font-size:.94rem;color:var(--ink);
  }

  /* Bottom nav */
  .bottom-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .nav-left,.nav-right{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:14px;padding:13px 22px;font-weight:800;font-size:.95rem;
    cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:linear-gradient(135deg,var(--blue-bright),var(--blue-deep));color:#fff;box-shadow:0 8px 20px rgba(40,90,220,.32);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(40,90,220,.4);}
  .btn-ghost{background:#fff;color:var(--blue-deep);border:1.6px solid #d3e2ff;}
  .btn-ghost:hover{background:var(--blue-ice);}
  .btn-restart{background:var(--white);color:var(--coral);border:1.6px solid #ffd2c2;}
  .btn-restart:hover{background:#fff3ee;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;}

  /* ---------- WELCOME ---------- */
  .goals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0 6px;}
  .goal-item{
    display:flex;gap:10px;align-items:flex-start;background:var(--blue-ice);
    border-radius:14px;padding:12px 14px;font-size:.92rem;font-weight:600;color:var(--ink);
  }
  .goal-item .tick{color:var(--mint);font-size:1.1rem;flex:0 0 auto;}
  .activity-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin:16px 0;
  }
  .activity-chip{
    background:#fff;border:2px solid #e3ecff;border-radius:16px;padding:16px 8px;
    display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
    font-weight:700;font-size:.82rem;color:var(--ink-soft);transition:all .18s ease;
    text-align:center;
  }
  .activity-chip .emoji{font-size:1.9rem;}
  .activity-chip:hover{border-color:var(--blue-light);transform:translateY(-3px);box-shadow:var(--shadow-soft);}
  .activity-chip.selected{
    background:linear-gradient(135deg,var(--blue-ice),#dbe9ff);
    border-color:var(--blue-bright);color:var(--blue-deep);box-shadow:var(--shadow-soft);
  }
  .activity-chip.selected .emoji{transform:scale(1.15);}

  /* ---------- GRAMMAR ---------- */
  .example-box{
    background:var(--blue-ice);border-left:5px solid var(--blue-bright);
    border-radius:12px;padding:12px 16px;margin:8px 0;font-size:.98rem;
  }
  .grammar-block{margin-bottom:6px;}
  table.conj{width:100%;border-collapse:separate;border-spacing:0 6px;margin:10px 0;}
  table.conj th{text-align:left;color:var(--ink-soft);font-size:.8rem;padding:4px 12px;}
  table.conj td{background:#f6f9ff;padding:9px 14px;font-weight:700;color:var(--ink);}
  table.conj tr td:first-child{border-radius:10px 0 0 10px;color:var(--blue-deep);}
  table.conj tr td:last-child{border-radius:0 10px 10px 0;}
  .rule-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0;}
  .rule-card{background:#fff;border:1.6px solid #e6edff;border-radius:14px;padding:14px 16px;}
  .rule-card h4{margin:0 0 8px;color:var(--blue-deep);font-size:.92rem;}
  .rule-card .row{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;margin:4px 0;color:var(--ink);}
  .rule-card .arrow{color:var(--blue-bright);}
  .right-wrong{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;}
  .rw{flex:1 1 220px;border-radius:12px;padding:12px 14px;font-weight:700;font-size:.92rem;}
  .rw.wrong{background:var(--red-bg);color:#a5311c;}
  .rw.right{background:var(--mint-bg);color:#0f7a55;}
  .freq-scale{display:flex;justify-content:space-between;gap:6px;margin:16px 0 10px;flex-wrap:wrap;}
  .freq-item{flex:1 1 90px;text-align:center;}
  .freq-bar{height:10px;border-radius:6px;margin-bottom:6px;}
  .freq-item span{font-size:.78rem;font-weight:700;color:var(--ink-soft);}
  .ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:10px;}
  .ref-card{border-radius:16px;padding:16px 18px;}
  .ref-card h4{margin:0 0 8px;font-size:.95rem;}
  .ref-card p{margin:4px 0;font-weight:600;font-size:.92rem;}
  .ref-pos{background:var(--mint-bg);color:#0f7a55;}
  .ref-neg{background:var(--red-bg);color:#a5311c;}
  .ref-q{background:var(--amber-bg);color:#8a5300;}
  .ref-star{background:var(--blue-ice);color:var(--blue-deep);}

  /* ---------- QUESTIONS (shared: practice / mastery / listening / homework) ---------- */
  .q-progress{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin-bottom:10px;}
  .question-card{
    background:#fff;border:1.6px solid #e6edff;border-radius:18px;padding:20px 22px;margin-bottom:16px;
  }
  .question-card .q-text{font-size:1.05rem;font-weight:700;color:var(--ink);margin-bottom:14px;}
  .q-text .tag{
    display:inline-block;font-size:.68rem;font-weight:800;color:var(--blue-deep);
    background:var(--blue-ice);border-radius:999px;padding:3px 10px;margin-bottom:8px;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{
    text-align:left;background:#f7f9ff;border:1.8px solid #e2eaff;border-radius:12px;
    padding:11px 14px;font-size:.95rem;font-weight:600;cursor:pointer;color:var(--ink);
    transition:all .15s ease;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--blue-light);background:#eef4ff;}
  .opt-btn.correct-answer{background:var(--mint-bg);border-color:var(--mint);color:#0f7a55;}
  .opt-btn.wrong-answer{background:var(--red-bg);border-color:var(--red);color:#a5311c;}
  .opt-btn:disabled{cursor:default;}
  .blank-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .blank-row input[type=text]{
    flex:1 1 220px;padding:11px 14px;border-radius:12px;border:1.8px solid #e2eaff;
    font-size:.98rem;font-family:inherit;
  }
  .blank-row input[type=text]:focus{outline:3px solid var(--blue-light);border-color:var(--blue-bright);}
  .check-btn{
    background:var(--blue-bright);color:#fff;border:none;border-radius:12px;
    padding:11px 18px;font-weight:800;cursor:pointer;
  }
  .check-btn:disabled{opacity:.5;cursor:not-allowed;}
  .feedback{
    margin-top:14px;border-radius:12px;padding:12px 14px;font-size:.92rem;display:none;
  }
  .feedback.show{display:block;animation:fadeUp .3s ease;}
  .feedback.ok{background:var(--mint-bg);color:#0f7a55;}
  .feedback.bad{background:var(--red-bg);color:#a5311c;}
  .feedback strong.title{display:block;font-size:1rem;margin-bottom:4px;}
  .feedback .why{color:var(--ink);font-weight:500;margin-top:6px;}
  .score-summary{
    text-align:center;padding:26px 20px;border-radius:20px;
    background:linear-gradient(135deg,var(--blue-ice),#dfe9ff);margin-top:6px;
  }
  .score-summary .big{font-family:var(--font-head);font-size:2.4rem;color:var(--blue-deep);font-weight:800;}
  .score-summary .pct{font-size:1.05rem;color:var(--ink-soft);font-weight:700;}
  .score-summary .msg{margin-top:8px;font-weight:700;color:var(--blue-deep);}

  /* ---------- MASTERY story ---------- */
  .story-box{
    background:linear-gradient(180deg,#fbfdff,#f3f7ff);
    border:1.6px solid #e2eaff;border-radius:18px;padding:22px 24px;font-size:1.02rem;
    line-height:1.75;color:var(--ink);margin-bottom:18px;
  }
  .story-box .story-title{font-family:var(--font-head);color:var(--blue-deep);font-size:1.15rem;margin:0 0 10px;}

  /* ---------- GAME ---------- */
  .game-wrap{position:relative;}
  .game-hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .hud-chip{
    background:var(--blue-ice);color:var(--blue-deep);font-weight:800;font-size:.85rem;
    padding:8px 16px;border-radius:999px;
  }
  .sentence-banner{
    background:linear-gradient(135deg,var(--blue-deep),var(--blue-bright));
    color:#fff;border-radius:16px;padding:16px 20px;font-size:1.1rem;font-weight:700;
    text-align:center;margin-bottom:18px;box-shadow:var(--shadow-soft);
  }
  .map-area{
    position:relative;
    background:
      radial-gradient(circle at 50% 0%, #fff9e8 0%, transparent 55%),
      linear-gradient(180deg,#eaf6ff,#e4f0ff 60%,#e9f9ee);
    border-radius:20px;padding:20px;min-height:430px;border:1.6px solid #dcecff;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto auto;gap:14px;
  }
  .zone{
    border-radius:16px;padding:14px 12px;text-align:center;font-weight:800;font-size:.85rem;
    color:var(--ink);background:#fff;border:2.5px dashed #cfe0ff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    min-height:110px;transition:all .18s ease;
  }
  .zone .zicon{font-size:1.8rem;}
  .zone .zclue{font-size:.72rem;font-weight:600;color:var(--ink-soft);}
  .zone.hover-ok{background:var(--mint-bg);border-color:var(--mint);transform:scale(1.03);}
  .zone.correct-flash{background:var(--mint-bg);border-color:var(--mint);border-style:solid;}
  .zone.wrong-flash{animation:shake .4s ease;border-color:var(--red);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .character-dock{
    display:flex;justify-content:center;margin-top:18px;
  }
  .char-card{
    width:150px;background:#fff;border-radius:20px;padding:16px 10px 12px;text-align:center;
    box-shadow:var(--shadow-pop);cursor:grab;touch-action:none;user-select:none;
    border:2.5px solid var(--blue-light);position:relative;z-index:20;
  }
  .char-card:active{cursor:grabbing;}
  .char-card .avatar{font-size:2.6rem;display:block;margin-bottom:6px;}
  .char-card .cname{font-weight:800;color:var(--blue-deep);font-size:.95rem;}
  .char-card.dragging{position:fixed;pointer-events:none;box-shadow:0 20px 40px rgba(20,50,130,.35);transform:scale(1.06);}
  .drag-hint{text-align:center;color:var(--ink-soft);font-size:.85rem;font-weight:600;margin-top:8px;}
  .game-feedback{
    margin-top:16px;border-radius:16px;padding:16px 18px;font-size:.95rem;display:none;text-align:center;
  }
  .game-feedback.show{display:block;animation:fadeUp .3s ease;}
  .game-feedback.ok{background:var(--mint-bg);color:#0f7a55;}
  .game-feedback.bad{background:var(--amber-bg);color:#8a5300;}
  .game-feedback .gf-title{font-family:var(--font-head);font-size:1.2rem;margin-bottom:4px;}
  .game-final{text-align:center;padding:34px 20px;}
  .game-final .trophy{font-size:3.4rem;}
  .points-float{
    position:fixed;font-family:var(--font-head);font-weight:800;color:var(--mint);
    font-size:1.4rem;pointer-events:none;z-index:60;animation:floatUp 1s ease forwards;
  }
  @keyframes floatUp{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-60px);}}

  /* ---------- LISTENING ---------- */
  .player{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--blue-ice);border-radius:18px;padding:16px 18px;margin-bottom:18px;
  }
  .player-btn{
    width:46px;height:46px;border-radius:50%;border:none;background:var(--blue-bright);color:#fff;
    font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(40,90,220,.3);
  }
  .player-btn.secondary{background:#fff;color:var(--blue-deep);border:1.6px solid #cfe0ff;box-shadow:none;}
  .speed-group{display:flex;gap:6px;margin-left:auto;}
  .speed-btn{
    background:#fff;border:1.6px solid #cfe0ff;border-radius:10px;padding:6px 10px;font-size:.78rem;
    font-weight:700;color:var(--blue-deep);cursor:pointer;
  }
  .speed-btn.active{background:var(--blue-bright);color:#fff;border-color:transparent;}
  .player-status{font-size:.8rem;color:var(--ink-soft);font-weight:600;flex-basis:100%;}
  .transcript-toggle{font-size:.82rem;color:var(--blue-bright);font-weight:700;cursor:pointer;background:none;border:none;padding:0;}
  .transcript-box{
    display:none;background:#f7f9ff;border-radius:14px;padding:14px 16px;margin:10px 0 18px;font-size:.92rem;line-height:1.6;color:var(--ink-soft);
  }
  .transcript-box.show{display:block;}

  /* ---------- Teacher tip / speaking ---------- */
  details.teacher-tip{
    background:#fff8e9;border:1.6px solid #ffe6ad;border-radius:16px;padding:12px 18px;margin:18px 0;
  }
  details.teacher-tip summary{cursor:pointer;font-weight:800;color:#8a5300;font-size:.95rem;}
  details.teacher-tip .tip-body{margin-top:10px;font-size:.92rem;color:var(--ink);line-height:1.6;}
  .speak-card{
    background:var(--blue-ice);border-radius:16px;padding:16px 18px;margin-bottom:12px;
  }
  .speak-card .sentence{font-weight:800;color:var(--blue-deep);margin-bottom:8px;}
  .speak-card .qline{font-size:.92rem;color:var(--ink);margin:4px 0;}
  .speak-card .ans{
    display:none;font-size:.9rem;color:#0f7a55;background:var(--mint-bg);border-radius:8px;
    padding:6px 10px;margin-top:4px;width:fit-content;
  }
  .speak-card .ans.show{display:block;}
  .reveal-btn{
    background:none;border:1.5px dashed var(--blue-bright);color:var(--blue-bright);
    font-weight:700;font-size:.8rem;border-radius:8px;padding:5px 10px;cursor:pointer;margin-top:6px;
  }

  /* ---------- RESULTS ---------- */
  .results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:18px 0;}
  .result-item{background:#fff;border:1.6px solid #e6edff;border-radius:16px;padding:16px 18px;}
  .result-item .r-label{font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .result-item .r-bar{height:10px;border-radius:999px;background:#e8eefc;overflow:hidden;margin-bottom:6px;}
  .result-item .r-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue-light),var(--blue-bright));}
  .result-item .r-pct{font-weight:800;color:var(--blue-deep);}
  .overall-hero{
    text-align:center;padding:32px 20px;border-radius:22px;
    background:linear-gradient(135deg,var(--blue-deep),var(--blue-bright));color:#fff;margin-bottom:20px;
  }
  .overall-hero .lbl{font-size:.95rem;font-weight:700;opacity:.85;letter-spacing:.4px;}
  .overall-hero .num{font-family:var(--font-head);font-size:3.4rem;font-weight:800;margin:6px 0;}
  .chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{background:var(--blue-ice);color:var(--blue-deep);font-weight:700;font-size:.82rem;padding:7px 14px;border-radius:999px;}
  .remember-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;}
  .remember-item{background:var(--blue-ice);border-radius:12px;padding:10px 14px;font-weight:700;font-size:.88rem;color:var(--blue-deep);}

  footer.foot{text-align:center;color:var(--ink-soft);font-size:.8rem;padding:18px 0 6px;}

  @media (max-width:640px){
    .card{padding:20px 18px;}

function shuffledOrder(){
  const arr = GAME_ROUNDS.map((_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function buildShell(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map((t,i)=>`
    <button class="tab-btn" role="tab" data-idx="${i}" aria-selected="false">
      <span class="num">${i+1}</span><span>${t.icon} ${t.label}</span>
    </button>`).join('');
  nav.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> goToTab(parseInt(btn.dataset.idx)));
  });

  const panels = document.getElementById('panels');
  panels.innerHTML = TABS.map(t=>`<section class="panel" id="panel-${t.id}" role="tabpanel"></section>`).join('');

  document.getElementById('restartTop').addEventListener('click', restartLesson);

  renderAllPanels();

function renderAllPanels(){
  renderWelcome();
  renderGrammar();
  renderPractice();
  renderMastery();
  renderGame();
  renderListening();
  renderHomework();
  renderResults();
}

function goToTab(idx, silent){
  state.currentTab = idx;
  if(idx > state.furthestTab) state.furthestTab = idx;

  document.querySelectorAll('.tab-btn').forEach((btn,i)=>{
    btn.classList.toggle('active', i===idx);
    btn.classList.toggle('done', i < state.furthestTab && i!==idx);
    btn.setAttribute('aria-selected', i===idx ? 'true':'false');
  });
  document.querySelectorAll('.panel').forEach((p,i)=>{
    p.classList.toggle('active', i===idx);
  });

  const pct = Math.round((state.furthestTab)/(TABS.length-1)*100);
  document.getElementById('progressFill').style.width = Math.max(pct, (idx/(TABS.length-1))*100*0.14+ (idx===0?4:0)) + '%';
  document.getElementById('progressFill').style.width = ((idx)/(TABS.length-1)*100) + '%';
  document.getElementById('progressText').textContent = `Section ${idx+1} of ${TABS.length}: ${TABS[idx].label}`;
  document.getElementById('progressPct').textContent = Math.round((idx)/(TABS.length-1)*100) + '% through lesson';

  if(idx === TABS.length-1) updateResults();
  if(!silent) window.scrollTo({top:0, behavior:'smooth'});
}

function restartLesson(){
  if(!confirm('Restart the whole lesson? Your answers and scores will be cleared.')) return;
  resetState();
  renderAllPanels();
  goToTab(0);
}

function navButtons(prevIdx, nextIdx, extra){
  const prevDisabled = prevIdx===null ? 'disabled' : '';
  const nextLabel = nextIdx===null ? '' : `Next: ${TABS[nextIdx].icon} ${TABS[nextIdx].label} →`;
  return `
    <div class="bottom-nav">
      <div class="nav-left">
        <button class="btn btn-ghost" ${prevDisabled} onclick="${prevIdx===null?'':'goToTab('+prevIdx+')'}">← Back</button>
        <button class="btn btn-restart" onclick="restartLesson()">🔄 Restart Lesson</button>
      </div>
      <div class="nav-right">${extra||''}
        ${nextIdx!==null ? `<button class="btn btn-primary" onclick="goToTab(${nextIdx})">${nextLabel}</button>` : ''}
      </div>
    </div>`;
}

/* ============================================================
   GENERIC QUESTION RENDERING (Practice / Mastery / Listening / Homework)
   ============================================================ */
function renderQuestionCard(q, idx, storeKey, groupPrefix){
  const stored = state[storeKey].answered[idx];
  const answered = !!stored;
  let body = '';
  if(q.type === 'mcq'){
    body = `<div class="options">${q.options.map((opt,oi)=>`
      <button type="button" class="opt-btn" data-oi="${oi}" ${answered?'disabled':''}
        onclick="handleMCQAnswer('${storeKey}',${idx},${oi})">${opt}</button>`).join('')}</div>`;
  } else {
    body = `<div class="blank-row">
      <input type="text" id="${groupPrefix}-input-${idx}" ${answered?'disabled':''} value="${answered?stored.given:''}" placeholder="Type your answer" autocomplete="off">
      <button type="button" class="check-btn" ${answered?'disabled':''} onclick="handleBlankAnswer('${storeKey}',${idx})">Check</button>
    </div>`;
  }
  let feedback = '';
  if(answered){
    const ok = stored.correct;
    feedback = `<div class="feedback show ${ok?'ok':'bad'}">
      <strong class="title">${ok? '✅ Correct!' : '❌ Not quite!'}</strong>
      ${!ok ? `<div><strong>Correct answer:</strong> ${q.type==='mcq'? q.options[q.correct] : q.answer}</div>` : ''}
      <div class="why"><strong>Why?</strong> ${q.why}</div>
    </div>`;
  } else {
    feedback = `<div class="feedback" id="${groupPrefix}-fb-${idx}"></div>`;
  }
  return `
    <div class="question-card" id="${groupPrefix}-card-${idx}">
      <div class="q-text"><span class="tag">${q.tag}</span><br>${idx+1}. ${q.text}</div>
      ${body}
      ${feedback}
    </div>`;
}

function markCardResult(groupPrefix, idx, q, correct, chosenOptionIdx){
  const card = document.getElementById(`${groupPrefix}-card-${idx}`);
  if(!card) return;
  if(q.type === 'mcq'){
    card.querySelectorAll('.opt-btn').forEach((btn,oi)=>{
      btn.disabled = true;
      if(oi === q.correct) btn.classList.add('correct-answer');
      if(oi === chosenOptionIdx && oi !== q.correct) btn.classList.add('wrong-answer');
    });
  } else {
    const input = document.getElementById(`${groupPrefix}-input-${idx}`);
    if(input) input.disabled = true;
    const btn = card.querySelector('.check-btn');
    if(btn) btn.disabled = true;
  }
  const fb = document.getElementById(`${groupPrefix}-fb-${idx}`);
  if(fb){
    fb.classList.add('show', correct?'ok':'bad');
    fb.innerHTML = `<strong class="title">${correct? '✅ Correct!' : '❌ Not quite!'}</strong>
      ${!correct ? `<div><strong>Correct answer:</strong> ${q.type==='mcq'? q.options[q.correct] : q.answer}</div>` : ''}
      <div class="why"><strong>Why?</strong> ${q.why}</div>`;
  }
}

const GROUP_MAP = {
  practice: {bank: PRACTICE_Q, prefix:'pr'},
  mastery: {bank: MASTERY_Q, prefix:'ms'},
  listening: {bank: LISTENING_Q, prefix:'ls'},
  homework: {bank: HOMEWORK_Q, prefix:'hw'}
};

function handleMCQAnswer(storeKey, idx, oi){
  const {bank, prefix} = GROUP_MAP[storeKey];
  const q = bank[idx];
  if(state[storeKey].answered[idx]) return;
  const correct = (oi === q.correct);
  state[storeKey].answered[idx] = {correct, given: q.options[oi]};
  if(correct) state[storeKey].score++;
  markCardResult(prefix, idx, q, correct, oi);
  updateScoreFooter(storeKey);
}

function handleBlankAnswer(storeKey, idx){
  const {bank, prefix} = GROUP_MAP[storeKey];
  const q = bank[idx];
  if(state[storeKey].answered[idx]) return;
  const input = document.getElementById(`${prefix}-input-${idx}`);
  const given = (input.value || '').trim().toLowerCase().replace(/[.!?]+$/,'');
  const correct = given === q.answer.toLowerCase();
  state[storeKey].answered[idx] = {correct, given: input.value};
  if(correct) state[storeKey].score++;
  markCardResult(prefix, idx, q, correct, null);
  updateScoreFooter(storeKey);
}

function updateScoreFooter(storeKey){
  const el = document.getElementById(storeKey+'ScoreLine');
  const bank = GROUP_MAP[storeKey].bank;
  if(el) el.textContent = `Score so far: ${state[storeKey].score} / ${Object.keys(state[storeKey].answered).length} answered (of ${bank.length})`;
}

/* Recompute the "final score" line whenever an answer is submitted, by overriding markCardResult flow */
const originalHandlers = {mcq: handleMCQAnswer, blank: handleBlankAnswer};
function wrapUpChecker(storeKey, total, scoreElId, pctElId, label){
  // Poll via mutation-free approach: hook into updateScoreFooter chain by monkey-patching once
}
function refreshFinalScore(storeKey, total, scoreElId, pctElId, label){
  const answeredCount = Object.keys(state[storeKey].answered).length;
  const scoreEl = document.getElementById(scoreElId);
  const pctEl = document.getElementById(pctElId);
  if(!scoreEl) return;
  if(answeredCount < total){
    scoreEl.textContent = `${label}: — / ${total}`;
    pctEl.textContent = `${total-answeredCount} question(s) left to answer.`;
  } else {
    const score = state[storeKey].score;
    const pct = Math.round(score/total*100);
    scoreEl.textContent = `${label}: ${score} / ${total}`;
    pctEl.textContent = `Percentage: ${pct}%`;
  }
}

function showGameRound(){

    </div>`;
  initDrag(document.getElementById('dragChar'), roundData);
}

function initDrag(el, roundData){
  let dragging = false, offsetX=0, offsetY=0, startRect=null;

  function pointerDown(e){
    e.preventDefault();
    dragging = true;
    startRect = el.getBoundingClientRect();
    el.classList.add('dragging');
    el.style.width = startRect.width+'px';
    el.style.left = startRect.left+'px';
    el.style.top = startRect.top+'px';
    offsetX = (e.clientX ?? e.touches[0].clientX) - startRect.left;
    offsetY = (e.clientY ?? e.touches[0].clientY) - startRect.top;
    el.setPointerCapture && e.pointerId!==undefined && el.setPointerCapture(e.pointerId);
    document.addEventListener('pointermove', pointerMove);
    document.addEventListener('pointerup', pointerUp);
  }
  function pointerMove(e){
    if(!dragging) return;
    const x = e.clientX, y = e.clientY;
    el.style.left = (x-offsetX)+'px';
    el.style.top = (y-offsetY)+'px';
    document.querySelectorAll('.zone').forEach(z=>{
      const r = z.getBoundingClientRect();
      const over = x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
      z.classList.toggle('hover-ok', over);
    });
  }
  function pointerUp(e){
    if(!dragging) return;
    dragging = false;
    document.removeEventListener('pointermove', pointerMove);
    document.removeEventListener('pointerup', pointerUp);
    const x = e.clientX, y = e.clientY;
    let dropZone = null;
    document.querySelectorAll('.zone').forEach(z=>{
      const r = z.getBoundingClientRect();
      if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) dropZone = z;
    });
    document.querySelectorAll('.zone').forEach(z=> z.classList.remove('hover-ok'));

    if(!dropZone){
      resetCharPosition(el);
      return;
    }
    const key = dropZone.dataset.zone;
    if(key === roundData.zone){
      dropZone.classList.add('correct-flash');
      el.classList.remove('dragging');
      el.style.position='';el.style.left='';el.style.top='';el.style.width='';
      showFloatPoints(x,y);
      gameCorrect(roundData, dropZone);
    } else {
      dropZone.classList.add('wrong-flash');
      setTimeout(()=> dropZone.classList.remove('wrong-flash'), 450);
      resetCharPosition(el);
      gameWrong(roundData);
    }
  }
  el.addEventListener('pointerdown', pointerDown);
  el.style.touchAction = 'none';
}

function resetCharPosition(el){
  el.classList.remove('dragging');
  el.style.position='';el.style.left='';el.style.top='';el.style.width='';
}

function showFloatPoints(x,y){
  const p = document.createElement('div');
  p.className = 'points-float';
  p.textContent = '⭐ +10';
  p.style.left = (x-20)+'px';
  p.style.top = (y-20)+'px';
  document.body.appendChild(p);
  setTimeout(()=> p.remove(), 1000);
}

    <div style="margin-top:6px;">You matched the routine with the correct place.</div>`;
  setTimeout(()=>{
    state.game.round++;
    if(state.game.round >= GAME_ROUNDS.length){
      state.game.finished = true;
      showGameFinal();
    } else {
      showGameRound();
    }
  }, 1400);
}

    });

function speakText(text, statusElId){
  if(!('speechSynthesis' in window)){
    const st = document.getElementById(statusElId);
    if(st) st.textContent = 'Audio playback is not supported in this browser. Please read the transcript instead.';
    return;
  }
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = ttsRate;
  utt.lang = 'en-US';
  ttsUtterance = utt;
  const st = document.getElementById(statusElId);
  utt.onstart = ()=>{ if(st) st.textContent = 'Playing…'; };
  utt.onend = ()=>{ if(st) st.textContent = 'Finished. Tap 🔁 to replay.'; };
  utt.onerror = ()=>{ if(st) st.textContent = 'Playback stopped.'; };
  window.speechSynthesis.speak(utt);
}
function playListening(){ speakText(LISTENING_SCRIPT, 'playerStatus'); }
function pauseListening(){
  if('speechSynthesis' in window){
    if(window.speechSynthesis.speaking && !window.speechSynthesis.paused){
      window.speechSynthesis.pause();
      document.getElementById('playerStatus').textContent = 'Paused.';
    } else if(window.speechSynthesis.paused){
      window.speechSynthesis.resume();
      document.getElementById('playerStatus').textContent = 'Playing…';
    }
  }
}
function replayListening(){ playListening(); }

function renderHomeworkQuestion(q, idx){
  let body = '';
  if(q.type === 'mcq'){
    body = `<div class="options">${q.options.map((opt,oi)=>`
      <button type="button" class="opt-btn" data-oi="${oi}" onclick="selectHomeworkOption(${idx},${oi})">${opt}</button>`).join('')}</div>`;
  } else {
    body = `<div class="blank-row">
      <input type="text" id="hw-input-${idx}" placeholder="Type your answer" autocomplete="off" oninput="recordHomeworkBlank(${idx})">
    </div>`;
  }
  return `<div class="question-card" id="hw-card-${idx}">
      <div class="q-text"><span class="tag">${q.tag}</span><br>${idx+1}. ${q.text}</div>
      ${body}
    </div>`;
}

function selectHomeworkOption(idx, oi){
  const q = HOMEWORK_Q[idx];
  state.homework.answered[idx] = {given:q.options[oi]};
  const card = document.getElementById('hw-card-'+idx);
  card.querySelectorAll('.opt-btn').forEach((b,i)=> b.classList.toggle('selected-choice', i===oi));
  card.querySelectorAll('.opt-btn').forEach((b,i)=>{
    b.style.borderColor = (i===oi) ? 'var(--blue-bright)' : '#e2eaff';
    b.style.background = (i===oi) ? '#eaf1ff' : '#f7f9ff';
  });
  updateHomeworkProgress();
}
function recordHomeworkBlank(idx){
  const val = document.getElementById('hw-input-'+idx).value;
  state.homework.answered[idx] = {given: val};
  updateHomeworkProgress();
}
function updateHomeworkProgress(){
  const el = document.getElementById('homeworkProgressLine');
  if(el) el.textContent = `${Object.keys(state.homework.answered).length} of ${HOMEWORK_Q.length} answered`;
}

function submitHomework(){
  let score = 0;
  HOMEWORK_Q.forEach((q,idx)=>{
    const given = (state.homework.answered[idx] && state.homework.answered[idx].given) || '';
    let correct = false;
    if(q.type === 'mcq'){
      correct = given === q.options[q.correct];
    } else {
      correct = given.trim().toLowerCase().replace(/[.!?]+$/,'') === q.answer.toLowerCase();
    }
    state.homework.answered[idx] = {given: given || '(no answer)', correct};
    if(correct) score++;
  });
  state.homework.score = score;
  state.homework.submitted = true;
  renderHomework();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderHomeworkResults(){
  const total = HOMEWORK_Q.length;
  const score = state.homework.score;
  const pct = Math.round(score/total*100);
  const html = `
    <div class="card">
      <h2>🏆 Homework Results</h2>
      <div class="score-summary" style="margin-bottom:22px;">
        <div class="big">Score: ${score}/${total}</div>
        <div class="pct">Percentage: ${pct}%</div>
      </div>
      ${HOMEWORK_Q.map((q,idx)=>{
        const a = state.homework.answered[idx];
        const correctAnswerText = q.type==='mcq'? q.options[q.correct] : q.answer;
        return `<div class="question-card">
          <div class="q-text"><span class="tag">${q.tag}</span><br>Question ${idx+1}<br><span style="font-weight:600;color:var(--ink-soft);font-size:.92rem;">${q.text}</span></div>
          <div style="font-size:.92rem;margin-bottom:6px;">Your answer: <strong>${a.given}</strong></div>
          <div style="font-size:.92rem;margin-bottom:10px;">Correct answer: <strong>${correctAnswerText}</strong></div>
          <div class="feedback show ${a.correct?'ok':'bad'}">
            <strong class="title">${a.correct? '✅ Correct!':'❌ Not quite.'}</strong>
            <div class="why"><strong>Why?</strong> ${q.why}</div>
          </div>
        </div>`;
      }).join('')}
      ${navButtons(5, 7, `<button class="btn btn-ghost" onclick="redoHomework()">↺ Redo Homework</button>`)}
    </div>`;
  document.getElementById('panel-homework').innerHTML = html;
}
function redoHomework(){
  state.homework = {answered:{}, submitted:false, score:0};
  renderHomework();
}

}
